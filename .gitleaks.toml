# Secret-scanning config for the quality gate's `secret_findings` metric.
#
# That metric is scored `boolean_must_be_zero`: any non-zero value fails the
# build, and no baseline can ever grant a budget for it. So the scan has to be
# clean, which means the known-false matches have to be named here.
#
# gitleaks scans full git history, so one fixture line is re-reported once per
# commit that touched its file. That count therefore GROWS as history grows: a
# default-rules scan measured 1367 findings on 2026-08-29, up from ~1345 when
# this file was first written, without a single new fixture being added. Do not
# treat the number as a fixture. What is stable is the shape: three files
# (`tests/test_providers_section.py`, `tests/test_settings_screen.py`,
# `docs/superpowers/plans/2026-07-11-providers-settings.md`) and, between them,
# exactly FOUR distinct stub values -- the four listed below, which is why the
# list is complete rather than merely long enough.

[extend]
useDefault = true

# Value-scoped, NOT path-scoped. A `paths` entry makes gitleaks skip the file
# before scanning it, so every rule is suppressed for that whole file and a real
# credential committed there would never be reported again. Verified, not
# assumed: with a `paths` allowlist gitleaks reported scanning 32 bytes of a
# 158-byte tree, having skipped the fixture file outright, and a genuine
# `sk-or-v1-...` key planted in it went unreported. `condition = "AND"` does not
# rescue that — there is no value left to intersect against once the file is
# skipped.
#
# So the four stub values are named exactly instead. Each is anchored and
# literal, never `sk-or-test-.*`, which would wave through a real key that
# merely started the same way. Every file stays fully scanned, including the
# three fixture files.
#
# The tradeoff, stated plainly: these four strings are now excused anywhere in
# the repo, not just in the fixtures. That is the right trade — they are
# self-evidently fake, and staying silent about a fake value is the correct
# behaviour, whereas staying silent about three entire files is not.
[[allowlists]]
description = "Provider-key fixtures: the four known stub values, excused by value."
regexes = [
  '''^sk-or-test-1234abcd$''',
  '''^sk-or-verify-1234$''',
  '''^gm-key-12345678$''',
  '''^zen-key-12345678$''',
]

# Public request-deduplication UUID in serve-api.md. This is an operation ID,
# not an authentication credential. Match only that exact example value so
# the documentation and every other value remain fully scanned, including
# history containing the original example.
[[allowlists]]
description = "Public Idempotency-Key UUID example; grants no authentication."
regexes = [
  '''^4ea1b17f-6cdf-4e71-9b62-9db82d4f4e5d$''',
]
