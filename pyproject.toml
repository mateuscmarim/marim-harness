[project]
name = "marim-harness"
version = "0.1.0"
description = "A terminal coding agent on Pydantic AI + Textual"
readme = "README.md"
authors = [{ name = "Mateus Coutinho Marim", email = "mateus@marim.dev" }]
license = { file = "LICENSE" }
keywords = ["agent", "llm", "tui", "coding-assistant", "pydantic-ai", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = [
    # slim + explicit extras (v2 packaging): `openai` covers OpenRouter and
    # local OpenAI-compatible providers, `google` → google-genai, `mcp` →
    # fastmcp-slim[client] (mcp/config.py imports fastmcp.client.transports
    # directly). genai-prices is used directly by usage.py, so it is declared
    # here rather than relied on transitively.
    "pydantic-ai-slim[openai,google,mcp]>=2.8,<3",
    "genai-prices>=0.0.70",
    "httpx>=0.27",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6",
    "multilspy>=0.0.10",
]

[project.optional-dependencies]
# The interactive TUI. A bare install is headless-only (`marim -p`); the `marim`
# interactive launch prints an install hint when textual is absent.
tui = ["textual>=0.80"]
# The `marim serve` HTTP daemon (REST + SSE). Bare installs print an install
# hint when starlette/uvicorn are absent.
serve = ["starlette>=0.40", "uvicorn>=0.30"]

[project.urls]
Repository = "https://git.marim.dev/mateuscmarim/marim-harness"

[project.scripts]
marim = "marim_harness.__main__:main"
marim-harness = "marim_harness.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4",
    "ruff>=0.6",
    "pyright>=1.1.390",
    # The TUI tests (Textual Pilot) need textual even though it moved to the
    # optional `tui` extra, so plain `uv sync` keeps developing/CI working.
    "textual>=0.80",
    # Fail a hung test (a stuck Pilot app, a deadlocked worker) instead of
    # stalling the whole CI leg until the runner's job timeout.
    "pytest-timeout>=2",
    # The `marim serve` tests (Starlette TestClient) need these even though
    # they moved to the optional `serve` extra, so plain `uv sync` keeps
    # developing/CI working.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q --cov=marim_harness --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
# Per-test ceiling (pytest-timeout): generous — the slowest Pilot tests run a
# few seconds — so only a genuine hang trips it. The thread method kills the
# hung test with a stack dump instead of stalling the CI leg.
timeout = 120
markers = [
    # Opt-in tests that hit a real provider over the network and spend money.
    # They self-skip unless the relevant API key is exported (never from .env),
    # so the default suite and CI never touch the network. Run deliberately with
    # `uv run pytest -m live` (with the key exported).
    "live: exercises a real LLM provider; needs an API key, costs money",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# E/F/I: pycodestyle, pyflakes, import sorting. UP: pyupgrade (modernize for the
# 3.10 floor). B: flake8-bugbear (real bug patterns). SIM: flake8-simplify.
# C901: mccabe cyclomatic complexity — capped at 10 to keep functions branch-shallow.
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
