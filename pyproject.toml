[project]
name = "marim-harness"
version = "0.1.0"
description = "A terminal coding agent on Pydantic AI + Textual"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=1.107,<2",
    "httpx>=0.27",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6",
    "textual>=0.80",
]

[project.scripts]
marim = "marim_harness.__main__:main"
marim-harness = "marim_harness.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
