[project]
name = "marim-harness"
version = "0.2.0"
description = "An embeddable coding-agent harness on Pydantic AI, with a Textual TUI and headless mode"
# The readme is dynamic: hatch-fancy-pypi-readme rewrites the repo README's
# relative links/images to absolute forge URLs at build time, so the PyPI page
# renders them (PyPI has no base URL for relative references) while the
# in-repo README keeps relative links that work when browsing the forge.
dynamic = ["readme"]
authors = [{ name = "Mateus Coutinho Marim", email = "mateus@marim.dev" }]
license = { file = "LICENSE" }
keywords = ["agent", "llm", "tui", "coding-assistant", "pydantic-ai", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = [
    # slim + explicit extras (v2 packaging): `openai` covers OpenRouter and
    # local OpenAI-compatible providers, `google` → google-genai, `mcp` →
    # fastmcp-slim[client] (mcp/config.py imports fastmcp.client.transports
    # directly). genai-prices is used directly by usage.py, so it is declared
    # here rather than relied on transitively.
    "pydantic-ai-slim[openai,google,mcp]>=2.8,<3",
    "genai-prices>=0.0.70",
    "httpx>=0.27",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6",
    "multilspy>=0.0.10",
]

[project.optional-dependencies]
# The interactive TUI. A bare install is headless-only (`marim -p`); the `marim`
# interactive launch prints an install hint when textual is absent.
# flatlatex renders LaTeX math spans in replies as Unicode (see
# interfaces/tui/math_markdown.py); TUI-only because only the live TUI view
# transliterates — persisted transcripts keep raw LaTeX.
tui = ["textual>=0.80", "flatlatex>=0.15"]
# The `marim serve` HTTP daemon (REST + SSE). Bare installs print an install
# hint when starlette/uvicorn are absent. segno encodes the pairing QR
# (`marim serve qr`) — pure Python, no runtime deps, and used only as an
# encoder: the terminal rendering is ours, in interfaces/qr.py.
serve = ["starlette>=0.40", "uvicorn>=0.30", "segno>=1.6"]
# Dynamic workflows: model-authored orchestration scripts sandboxed in
# pydantic-monty. Bare installs leave the run_workflow tool returning an
# install hint (services.run_workflow stays None).
workflows = ["pydantic-monty>=0.0.18,<0.1", "jsonschema>=4"]
# The preferred Python language server (ships basedpyright-langserver, which
# the LSP manager auto-selects over multilspy's jedi fallback when on PATH).
# Optional because it's a per-machine tool choice, not a library dependency.
lsp-python = ["basedpyright>=1.13"]

# The public home is the GitHub mirror — the Gitea origin is private, so
# PyPI-facing URLs must point at github.com or they 404 for visitors.
[project.urls]
Repository = "https://github.com/mateuscmarim/marim-harness"
Changelog = "https://github.com/mateuscmarim/marim-harness/blob/master/CHANGELOG.md"

[project.scripts]
marim = "marim_harness.__main__:main"
marim-harness = "marim_harness.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4",
    "ruff>=0.6",
    "pyright>=1.1.390",
    # The TUI tests (Textual Pilot) need textual even though it moved to the
    # optional `tui` extra, so plain `uv sync` keeps developing/CI working.
    "textual>=0.80",
    # The math-rendering tests need flatlatex even though it lives in the
    # optional `tui` extra, so plain `uv sync` keeps developing/CI working.
    "flatlatex>=0.15",
    # Fail a hung test (a stuck Pilot app, a deadlocked worker) instead of
    # stalling the whole CI leg until the runner's job timeout.
    "pytest-timeout>=2",
    # Parallel test run (see addopts): -n auto + worksteal.
    "pytest-xdist>=3.5",
    # The `marim serve` tests (Starlette TestClient) need these even though
    # they moved to the optional `serve` extra, so plain `uv sync` keeps
    # developing/CI working.
    "starlette>=0.40",
    "uvicorn>=0.30",
    # The QR-rendering tests need segno even though it lives in the optional
    # `serve` extra, so plain `uv sync` keeps developing/CI working.
    "segno>=1.6",
    # Dynamic workflows: model-authored orchestration scripts sandboxed in
    # pydantic-monty. Bare installs leave the run_workflow tool returning an
    # install hint (services.run_workflow stays None).
    "pydantic-monty>=0.0.18,<0.1",
    "jsonschema>=4",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Images first (raw file URL), then remaining relative links (source view URL).
# Both patterns skip targets that are already absolute (http/https) or
# in-page anchors (#...).
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/mateuscmarim/marim-harness/master/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)\[([^\]]*)\]\((?!https?://|#)([^)]+)\)'
replacement = '[\1](https://github.com/mateuscmarim/marim-harness/blob/master/\2)'

[tool.pytest.ini_options]
# -n auto/worksteal (pytest-xdist): the suite is dominated by thousands of
# 0.1-4s tests (many Textual Pilot apps), so work-stealing parallelism cuts a
# ~5.5-minute serial run to under a minute. Pass `-n 0` to run serial (pdb,
# -x bisection, or chasing a suspected cross-test interaction).
addopts = "-q -n auto --dist worksteal --cov=marim_harness --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
# Per-test ceiling (pytest-timeout): generous — the slowest Pilot tests run a
# few seconds — so only a genuine hang trips it. The thread method kills the
# hung test with a stack dump instead of stalling the CI leg.
timeout = 120
markers = [
    # Opt-in tests that hit a real provider over the network and spend money.
    # They self-skip unless the relevant API key is exported (never from .env),
    # so the default suite and CI never touch the network. Run deliberately with
    # `uv run pytest -m live` (with the key exported).
    "live: exercises a real LLM provider; needs an API key, costs money",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# E/F/I: pycodestyle, pyflakes, import sorting. UP: pyupgrade (modernize for the
# 3.10 floor). B: flake8-bugbear (real bug patterns). SIM: flake8-simplify.
# C901: mccabe cyclomatic complexity — capped at 10 to keep functions branch-shallow.
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
