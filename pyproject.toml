[project]
name = "marim-harness"
version = "0.1.0"
description = "A terminal coding agent on Pydantic AI + Textual"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=1.107,<2",
    "httpx>=0.27",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6",
    "textual>=0.80",
    "multilspy>=0.0.10",
]

[project.scripts]
marim = "marim_harness.__main__:main"
marim-harness = "marim_harness.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4",
    "ruff>=0.6",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q --cov=marim_harness --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
markers = [
    # Opt-in tests that hit a real provider over the network and spend money.
    # They self-skip unless the relevant API key is exported (never from .env),
    # so the default suite and CI never touch the network. Run deliberately with
    # `uv run pytest -m live` (with the key exported).
    "live: exercises a real LLM provider; needs an API key, costs money",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# E/F/I: pycodestyle, pyflakes, import sorting. UP: pyupgrade (modernize for the
# 3.10 floor). B: flake8-bugbear (real bug patterns). SIM: flake8-simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
